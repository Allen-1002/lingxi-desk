name: Flutter Tag Build

# Lingxi releases (vX.Y.Z) are built and published by res/lingxi/release-android.sh,
# so a version tag must not start upstream's full build, which would upload its
# rustdesk-* packages into the same release. Run it by hand if needed.
on:
  workflow_dispatch:

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
